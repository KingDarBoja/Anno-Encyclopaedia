<section class="w-full flex flex-col items-center py-8">
  <h2 class="mb-4 text-center text-3xl font-bold">City Status Levels</h2>

  <p class="mb-12 max-w-2xl text-center px-4">Description goes here</p>

  <!-- Content Wrapper -->
  <div class="w-full max-w-[1600px] flex flex-col gap-12 px-6">
    <!-- <anno-toc [entries]="tocEntries()" /> -->

    <div>
      <h3
        class="text-xl font-bold mb-4 border-l-4 border-[var(--primary-color)] pl-2"
      >
        Roman Progression
      </h3>
      <anno-city-status-table [levels]="levelSetsRoman()" />
    </div>

    <div>
      <h3
        class="text-xl font-bold mb-4 border-l-4 border-[var(--primary-color)] pl-2"
      >
        Celtic Progression
      </h3>
      <anno-city-status-table [levels]="levelSetsCeltic()" />
    </div>
  </div>
</section>
