<div class="city-status-card">
  <header>
    <h3>{{ data().name }}</h3>
  </header>

  <div class="card-body-row">
    <div class="card-image-container">
      <div
        class="status-mask-icon"
        [style.mask-image]="'url(' + getSafeIconPath(data().image_url) + ')'"
        [style.-webkit-mask-image]="
          'url(' + getSafeIconPath(data().image_url) + ')'
        "
      ></div>
    </div>

    <div class="card-content">
      <div class="attr-column">
        <h4>Roman</h4>
        <ng-container
          *ngTemplateOutlet="
            attrList;
            context: { $implicit: data().attributes.roman }
          "
        />
      </div>

      <div class="attr-column">
        <h4>Regional</h4>
        <ng-container
          *ngTemplateOutlet="
            attrList;
            context: { $implicit: data().attributes.regional }
          "
        />
      </div>

      <div class="attr-column">
        <h4>Mixed</h4>
        <ng-container
          *ngTemplateOutlet="
            attrList;
            context: { $implicit: data().attributes.mixed }
          "
        />
      </div>
    </div>
  </div>
</div>

<ng-template #attrList let-set>
  <div class="attr-row">
    <div class="attr-icon icon-belief"></div>
    <span class="label">Belief</span>
    <span class="value" [class.neg]="set.belief < 0">{{
      formatValue(set.belief)
    }}</span>
  </div>

  <div class="attr-row">
    <div class="attr-icon icon-knowledge"></div>
    <span class="label">Knowledge</span>
    <span class="value" [class.neg]="set.knowledge < 0">{{
      formatValue(set.knowledge)
    }}</span>
  </div>

  <div class="attr-row">
    <div class="attr-icon icon-prestige"></div>
    <span class="label">Prestige</span>
    <span class="value" [class.neg]="set.prestige < 0">{{
      formatValue(set.prestige)
    }}</span>
  </div>

  <div class="attr-row">
    <div class="attr-icon icon-health"></div>
    <span class="label">Health</span>
    <span class="value" [class.neg]="set.health < 0">{{
      formatValue(set.health)
    }}</span>
  </div>

  <div class="attr-row">
    <div class="attr-icon icon-fire"></div>
    <span class="label">Fire Safety</span>
    <span class="value" [class.neg]="set.fire_safety < 0">{{
      formatValue(set.fire_safety)
    }}</span>
  </div>

  <div class="attr-row">
    <div class="attr-icon icon-happiness"></div>
    <span class="label">Happiness</span>
    <span class="value" [class.neg]="set.happiness < 0">{{
      formatValue(set.happiness)
    }}</span>
  </div>
</ng-template>
