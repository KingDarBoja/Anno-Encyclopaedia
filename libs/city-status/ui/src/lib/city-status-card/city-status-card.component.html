<div class="city-status-card">
  <header>
    <h3>{{ data().name }}</h3>
  </header>

  <div class="card-body-row">
    <div class="card-image-container">
      <div
        class="status-mask-icon"
        [style.mask-image]="'url(' + getSafeIconPath(data().image_url) + ')'"
        [style.-webkit-mask-image]="
          'url(' + getSafeIconPath(data().image_url) + ')'
        "
      ></div>
    </div>

    <!-- The 4-column grid container -->
    <div class="card-content grid-layout">
      <!-- Headers for the 3 value columns -->
      <div class="column-header label-spacer"></div>
      <div class="column-header"><h4>Roman</h4></div>
      <div class="column-header"><h4>Regional</h4></div>
      <div class="column-header"><h4>Mixed</h4></div>

      <!-- Attribute Rows -->
      @for (attr of attributes; track attr.key) {
        <!-- Column 1: Icon + Label -->
        <div class="attr-label-cell">
          <div
            class="attr-icon"
            [style.mask-image]="'url(' + iconBase + attr.icon + ')'"
            [style.-webkit-mask-image]="'url(' + iconBase + attr.icon + ')'"
          ></div>
          <span class="label-text">{{ attr.label }}</span>
        </div>

        <!-- Column 2: Roman Value -->
        <div class="attr-value-cell">
          <span
            class="value"
            [class.neg]="data().attributes.roman[attr.key] < 0"
          >
            {{ formatValue(data().attributes.roman[attr.key]) }}
          </span>
        </div>

        <!-- Column 3: Regional Value -->
        <div class="attr-value-cell">
          <span
            class="value"
            [class.neg]="data().attributes.regional[attr.key] < 0"
          >
            {{ formatValue(data().attributes.regional[attr.key]) }}
          </span>
        </div>

        <!-- Column 4: Mixed Value -->
        <div class="attr-value-cell">
          <span
            class="value"
            [class.neg]="data().attributes.mixed[attr.key] < 0"
          >
            {{ formatValue(data().attributes.mixed[attr.key]) }}
          </span>
        </div>
      }
    </div>
  </div>
</div>
